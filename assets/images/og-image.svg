<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#090a10"/>
      <stop offset="50%" style="stop-color:#1a1025"/>
      <stop offset="100%" style="stop-color:#090a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#d946ef"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8b5cf6" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1000" cy="80" r="200" fill="url(#glow)" opacity="0.5"/>
  <circle cx="200" cy="550" r="150" fill="url(#glow)" opacity="0.3"/>
  <circle cx="900" cy="500" r="100" fill="url(#glow)" opacity="0.2"/>

  <!-- Music notes floating -->
  <text x="150" y="120" font-size="60" fill="#8b5cf6" opacity="0.3">♪</text>
  <text x="1050" y="180" font-size="80" fill="#d946ef" opacity="0.25">♫</text>
  <text x="100" y="500" font-size="50" fill="#ec4899" opacity="0.2">♩</text>
  <text x="950" y="450" font-size="70" fill="#8b5cf6" opacity="0.2">♬</text>
  <text x="600" y="100" font-size="40" fill="#d946ef" opacity="0.15">♭</text>

  <!-- Logo & Brand -->
  <g filter="url(#shadow)">
    <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="bold" fill="url(#accent)" text-anchor="middle">MOODIFY</text>
  </g>

  <!-- Tagline -->
  <text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#e2e8f0" text-anchor="middle" opacity="0.9">Your Music. Your Mood. Your Story.</text>

  <!-- Divider line -->
  <line x1="450" y1="380" x2="750" y2="380" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Description -->
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">Platform musik sosial untuk menemukan lagu</text>
  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">berdasarkan mood, berbagi musik, dan</text>
  <text x="600" y="510" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#94a3b8" text-anchor="middle">berinteraksi dengan komunitas musik.</text>

  <!-- Developer credit -->
  <text x="600" y="570" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#64748b" text-anchor="middle">Developed by Bima Haris • music.bimaharis.my.id</text>

  <!-- Mood emojis -->
  <text x="380" y="280" font-size="48">☀️</text>
  <text x="460" y="280" font-size="48">🌧️</text>
  <text x="540" y="280" font-size="48">🌊</text>
  <text x="660" y="280" font-size="48">💗</text>
  <text x="740" y="280" font-size="48">⚡</text>
  <text x="820" y="280" font-size="48">🎧</text>
</svg>
